spring.application.name=event-decoration-planner
server.port=8080
spring.profiles.active=mysql

# H2 fallback settings; the active MySQL profile overrides this datasource.
spring.datasource.url=jdbc:h2:file:./data/eventplanner;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
